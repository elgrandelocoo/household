<style>
:root{--ink:#252823;--muted:#8c8f87;--paper:#f4f1ea;--card:#fbfaf6;--line:#dedbd1;--accent:#8c9a7d;--accent2:#c89b72;--danger:#b87970;--shadow:0 16px 45px rgba(55,57,48,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}body{overflow:hidden}body.auth-pending .app{visibility:hidden}body.auth-pending #loginOverlay{display:flex;align-items:center;justify-content:center}body.auth-pending #loginOverlay .sheet{margin:auto} .app{height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 54px)}.wrap{width:100%;max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:#9b9c94;font-weight:750}.title{font-size:39px;letter-spacing:-1.7px;line-height:1;margin:7px 0 7px;font-weight:820}.sub{font-size:13px;color:var(--muted)}.home-mark{width:54px;height:54px;border-radius:18px;background:#202832;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(35,40,45,.18);overflow:hidden;border:1px solid rgba(255,255,255,.12)}.home-mark img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.space-card{position:relative;min-height:122px;padding:12px;border:1px solid rgba(100,100,90,.10);border-radius:20px;background:var(--card);box-shadow:0 7px 20px rgba(55,57,48,.055);overflow:hidden;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}.space-card:active{transform:scale(.975)}.space-bg{position:absolute;right:-10px;bottom:-13px;font-size:60px;opacity:.10;transform:rotate(-8deg)}.space-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.space-icon{font-size:19px}.more{width:25px;height:25px;border:0;border-radius:8px;background:rgba(230,228,219,.7);color:#77796f;font-size:13px}.space-name{position:relative;z-index:1;margin-top:16px;font-size:14px;line-height:1.08;font-weight:780;letter-spacing:-.25px;max-width:95%;word-break:break-word}.space-meta{position:relative;z-index:1;margin-top:6px;color:#9a9b93;font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{position:absolute;left:12px;right:12px;bottom:11px;height:3px;background:#ebe8df;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}.custom-badge{position:absolute;left:12px;top:12px;padding:3px 5px;border-radius:6px;background:#f0e6db;color:#9b7658;font-size:6.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.empty-custom{color:#aaa99f;font-size:18px}.footer-note{text-align:center;margin:22px 0 0;color:#a4a49b;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.overlay{position:fixed;inset:0;z-index:20;display:none;background:rgba(35,37,32,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);overflow-y:auto}.overlay.show{display:flex;align-items:flex-end;justify-content:center}.login-overlay-show{}.sheet{width:100%;max-width:720px;max-height:94dvh;overflow-y:auto;background:#faf9f4;border-radius:30px 30px 22px 22px;padding:18px 18px calc(env(safe-area-inset-bottom) + 24px);box-shadow:0 25px 80px rgba(20,22,18,.22)}.handle{width:38px;height:4px;background:#d5d3cb;border-radius:99px;margin:0 auto 17px}.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.back{border:0;background:#ebe9e1;border-radius:13px;width:39px;height:39px;font-size:19px;color:#6f726a}.sheet-kicker{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#a1a299;font-weight:800}.sheet-title{font-size:29px;letter-spacing:-1px;font-weight:820;margin:4px 0 3px}.sheet-sub{font-size:11px;color:#999b92}.close{border:0;background:#e9e7df;width:39px;height:39px;border-radius:50%;font-size:20px;color:#72746c}.stats{display:flex;gap:8px;margin:18px 0}.stat{flex:1;background:#f0eee6;border-radius:16px;padding:11px 12px}.stat b{display:block;font-size:17px}.stat span{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#999b92}
.add{display:flex;gap:8px;margin:10px 0 14px}.add input{min-width:0;flex:1;border:1px solid var(--line);background:white;border-radius:16px;padding:14px;font:inherit;font-size:15px;outline:none}.add button{width:52px;border:0;border-radius:16px;background:#9baa8b;color:white;font-size:26px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;border:1px solid var(--line);background:white;border-radius:15px;padding:12px 13px;font:inherit;outline:none}.refresh{width:44px;border:1px solid var(--line);background:white;border-radius:15px;font-size:20px;color:#72766c}.items{display:flex;flex-direction:column;gap:9px;padding-bottom:25px}.item{background:white;border:1px solid rgba(120,120,110,.09);border-radius:19px;padding:14px;box-shadow:0 7px 24px rgba(55,57,48,.045)}.item-row{display:flex;align-items:flex-start;gap:11px}.check{flex:0 0 27px;width:27px;height:27px;border-radius:9px;border:2px solid #c9c9c0;background:#fbfaf6;color:#66715c;display:flex;align-items:center;justify-content:center;padding:0}.check.done{background:#dce6d5;border-color:#b4c2a8}.item-main{min-width:0;flex:1}.item-title{font-size:15px;font-weight:720;line-height:1.35;word-break:break-word}.done .item-title{text-decoration:line-through;color:#9a9c94}.note{margin-top:5px;font-size:12px;line-height:1.45;color:#92948b;white-space:pre-wrap}.item-actions{display:flex;gap:5px}.icon-btn{width:31px;height:31px;border:0;border-radius:10px;background:#f0eee7;color:#777970}.icon-btn.del{color:#a66d67;background:#f5e9e5}.thumbs{display:flex;gap:7px;overflow-x:auto;margin-top:11px;padding-bottom:2px}.thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:#eee}.section-label{font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:#a1a299;margin:18px 2px 8px;font-weight:800}.empty{padding:45px 15px;text-align:center;color:#a3a49c}.empty b{display:block;color:#878a81;font-size:15px;margin-bottom:5px}.empty span{font-size:11px}
.form label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:#9a9c93;font-weight:800;margin:14px 2px 6px}.form input,.form textarea{width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:13px;font:inherit;outline:none;color:var(--ink)}.form textarea{min-height:90px;resize:vertical}.primary{width:100%;border:0;background:#8f9e80;color:white;border-radius:15px;padding:14px;font:inherit;font-weight:780;margin-top:17px}.danger{width:100%;border:0;background:#f3e4e1;color:#9c625b;border-radius:15px;padding:13px;font:inherit;font-weight:700;margin-top:8px}.photo-add{border:1px dashed #c9c7be;background:#f7f5ee;color:#85887e;border-radius:15px;padding:14px;text-align:center;font-size:12px;display:block;cursor:pointer}.photo-add input{display:none}.photo-preview{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.preview-wrap{position:relative}.preview-wrap img{width:76px;height:76px;object-fit:cover;border-radius:12px}.remove-photo{position:absolute;right:-5px;top:-5px;width:22px;height:22px;border:0;border-radius:50%;background:#333;color:#fff;font-size:14px}
.login{max-width:390px;margin:auto}.login h2{font-size:25px;margin:0 0 7px}.login p{font-size:12px;line-height:1.5;color:#92948b}.login input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;margin:5px 0;font:inherit}.err{min-height:18px;color:#b06f67;text-align:center;font-size:11px;margin-top:7px}
@media(max-width:390px){.app{padding-left:11px;padding-right:11px;padding-top:calc(env(safe-area-inset-top) + 16px);padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}.grid{gap:7px}.space-card{min-height:116px;padding:10px;border-radius:17px}.space-icon{font-size:17px}.more{width:23px;height:23px;border-radius:7px;font-size:12px}.space-name{font-size:12.5px;margin-top:13px}.space-meta{font-size:7.5px;margin-top:5px}.progress{left:10px;right:10px;bottom:9px;height:3px}.custom-badge{left:10px;top:10px;font-size:6px;padding:2px 4px}.title{font-size:30px}.top{margin-bottom:16px}.home-mark{width:46px;height:46px;border-radius:15px;font-size:21px}}.space-card:nth-child(3n+1){background:linear-gradient(145deg,#fffaf4,#f7f0e7)}.space-card:nth-child(3n+2){background:linear-gradient(145deg,#fbfcf8,#edf3e8)}.space-card:nth-child(3n){background:linear-gradient(145deg,#faf9fd,#f0edf6)}.space-card:hover{box-shadow:0 12px 28px rgba(55,57,48,.10);transform:translateY(-1px)}.space-card:active{transform:scale(.975)}.space-name{max-width:100%}.add input:focus,.search:focus,.form input:focus,.form textarea:focus{border-color:#aeb9a1;box-shadow:0 0 0 3px rgba(140,154,125,.10)}.primary{background:linear-gradient(135deg,#879775,#a5b493);box-shadow:0 8px 20px rgba(125,145,108,.18)} </style>
</head>
<body>
<div class="app"><main class="wrap">
  <header class="top"><div><div class="eyebrow">Our home · Hausbau</div><h1 class="title">Building our place.</h1><div class="sub">Everything we need to decide, remember & finish.</div></div><div class="home-mark"><img src="apple-touch-icon.png" alt=""></div></header>
  <section class="grid" id="spaceGrid"></section>
  <div class="footer-note">Shared between us · always up to date</div>
</main></div>

<div class="overlay" id="loginOverlay"><div class="sheet login"><div class="handle"></div><h2>Our Home</h2><p>Log in with the same account you use for the shared To-Do lists.</p><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="primary" onclick="login()">Log in</button><div class="err" id="loginErr"></div></div></div>

<div class="overlay" id="spaceOverlay"><div class="sheet"><div class="handle"></div><div class="sheet-head"><div style="display:flex;gap:10px;align-items:flex-start"><button class="back" onclick="closeSpace()">‹</button><div><div class="sheet-kicker" id="spaceKicker"></div><div class="sheet-title" id="spaceTitle"></div><div class="sheet-sub">Shared planning space</div></div></div><button class="close" onclick="closeSpace()">×</button></div><div class="stats"><div class="stat"><b id="openCount">0</b><span>open</span></div><div class="stat"><b id="doneCount">0</b><span>done</span></div><div class="stat"><b id="photoCount">0</b><span>photos</span></div></div><div class="add"><input id="quickInput" maxlength="200" placeholder="Add something to remember…"><button onclick="addQuick()">+</button></div><div class="toolbar"><input id="search" class="search" type="search" placeholder="Search this room…" oninput="renderItems()"><button class="refresh" onclick="refreshSpace()">↻</button></div><div id="items" class="items"></div></div></div>

<div class="overlay" id="editOverlay"><div class="sheet"><div class="handle"></div><div class="sheet-head"><div><div class="sheet-kicker">House item</div><div class="sheet-title" id="editTitle">New item</div></div><button class="close" onclick="closeEdit()">×</button></div><div class="form"><label>What needs deciding / doing?</label><input id="itemTitle" maxlength="200" placeholder="e.g. Choose the kitchen worktop"><label>Notes</label><textarea id="itemNote" maxlength="3000" placeholder="Measurements, ideas, links, people to ask…"></textarea><label>Photos</label><label class="photo-add">＋ Add photos<input id="photoInput" type="file" accept="image/*" multiple></label><div class="photo-preview" id="photoPreview"></div><button class="primary" onclick="saveItem()">Save item</button><button class="danger" id="deleteEdit" onclick="deleteItem()">Delete item</button></div></div></div>

<div class="overlay" id="renameOverlay"><div class="sheet"><div class="handle"></div><div class="sheet-head"><div><div class="sheet-kicker">Custom space</div><div class="sheet-title">Rename this card</div></div><button class="close" onclick="closeRename()">×</button></div><div class="form"><label>Card name</label><input id="renameInput" maxlength="35" placeholder="e.g. Office, Utility Room…"><button class="primary" onclick="saveRename()">Save name</button></div></div></div>

<script>
const SUPABASE_URL="https://geshdseudikxkzukdxpm.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdlc2hkc2V1ZGlreGt6dWtkeHBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MzcyMjcsImV4cCI6MjEwMjUxMzIyN30.AqUtWSbdkk5ZtTcrAAZAVV1NjO57dZqENIWbqzbPPPo";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SPACE_KEY="ourHomeSpaces_v1";
const fixed=[
 {name:"Kitchen",icon:"🍳",bg:"◒"},{name:"Living Room",icon:"🛋️",bg:"◓"},{name:"Bathroom",icon:"🛁",bg:"◉"},{name:"Bedroom",icon:"🛏️",bg:"☾"},{name:"Schrankraum",icon:"👗",bg:"◇"},{name:"Garden",icon:"🌿",bg:"✦"},{name:"Carport",icon:"🚗",bg:"▱"}
];
const icons=["✦","⌂","◇","○","＋"];
let spaces=[];let selectedSpace=null;let currentUser=null;let currentItems=[];let editingId=null;let stagedPhotos=[];let deletedPhotoPaths=[];let realtime=null;
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
function defaultSpaces(){return [...fixed,...Array.from({length:5},(_,i)=>({name:`Custom ${i+1}`,icon:icons[i],bg:"✦",custom:true}))]}
async function loadSpaces(){const r=await sb.from('house_spaces').select('*').order('space_no',{ascending:true});if(r.error){console.error(r.error);spaces=defaultSpaces();renderSpaces();return}spaces=(r.data||[]).map(x=>({name:x.name,icon:x.icon,bg:x.bg,custom:x.custom,space_no:x.space_no}));if(spaces.length!==12)spaces=defaultSpaces();renderSpaces();await loadHomeCounts()}
async function loadHomeCounts(){const r=await sb.from('house_items').select('space_no,completed,house_item_photos(id)');if(r.error){console.error(r.error);return}const counts=Array.from({length:12},()=>({open:0,done:0,photos:0}));(r.data||[]).forEach(x=>{const c=counts[(x.space_no||1)-1];if(!c)return;x.completed?c.done++:c.open++;c.photos+=(x.house_item_photos||[]).length});counts.forEach((c,i)=>{const m=document.getElementById('meta-'+i),p=document.getElementById('prog-'+i);if(!m)return;const total=c.open+c.done;m.textContent=total?`${c.open} open · ${c.photos} photos`:'Ready for ideas';if(p)p.style.width=total?`${Math.round(c.done/total*100)}%`:'0%'}); }
function renderSpaces(){const g=document.getElementById('spaceGrid');g.innerHTML='';spaces.forEach((s,i)=>{const el=document.createElement('article');el.className='space-card';el.innerHTML=`${s.custom?'<div class="custom-badge">custom slot</div>':''}<div class="space-bg">${s.bg}</div><div class="space-top"><div class="space-icon">${s.icon}</div>${s.custom?'<button class="more" aria-label="Rename">•••</button>':''}</div><div class="space-name">${esc(s.name)}</div><div class="space-meta" id="meta-${i}">Loading…</div><div class="progress"><i id="prog-${i}"></i></div>`;el.onclick=e=>{if(e.target.closest('.more'))return;openSpace(i)};const more=el.querySelector('.more');if(more)more.onclick=e=>{e.stopPropagation();openRename(i)};g.appendChild(el)})}
async function session(){const {data}=await sb.auth.getSession();currentUser=data.session?.user||null;return !!currentUser}
async function requireAuth(){if(await session())return true;document.getElementById('loginOverlay').classList.add('show');return false}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,err=document.getElementById('loginErr');err.textContent='';if(!email||!password){err.textContent='Enter your email and password.';return}const r=await sb.auth.signInWithPassword({email,password});if(r.error){err.textContent=r.error.message;return}currentUser=r.data.user;document.getElementById('loginOverlay').classList.remove('show');await loadSpaces();document.body.classList.remove('auth-pending');if(selectedSpace!==null)await openSpace(selectedSpace)}
function openSpace(i){selectedSpace=i;document.getElementById('spaceKicker').textContent=`${String(i+1).padStart(2,'0')} / 12`;document.getElementById('spaceTitle').textContent=spaces[i].name;document.getElementById('search').value='';document.getElementById('spaceOverlay').classList.add('show');requireAuth().then(ok=>{if(ok){loadItems();setupRealtime()}})}
function closeSpace(){document.getElementById('spaceOverlay').classList.remove('show');selectedSpace=null;currentItems=[]}
async function openRename(i){if(!await requireAuth())return;selectedSpace=i;document.getElementById('renameInput').value=spaces[i].name;document.getElementById('renameOverlay').classList.add('show');setTimeout(()=>{document.getElementById('renameInput').focus();document.getElementById('renameInput').select()},60)}
function closeRename(){document.getElementById('renameOverlay').classList.remove('show')}
async function saveRename(){if(selectedSpace===null)return;const v=document.getElementById('renameInput').value.trim();if(!v)return;const r=await sb.from('house_spaces').update({name:v,updated_at:new Date().toISOString()}).eq('space_no',selectedSpace+1);if(r.error){alert(r.error.message);return}spaces[selectedSpace].name=v;closeRename();renderSpaces()}
async function loadItems(){if(!currentUser||selectedSpace===null)return;const {data,error}=await sb.from('house_items').select('*, house_item_photos(id,storage_path)').eq('space_no',selectedSpace+1).order('created_at',{ascending:true});if(error){console.error(error);document.getElementById('items').innerHTML=`<div class="empty"><b>House database not set up yet</b><span>Run the included Supabase SQL setup once.</span></div>`;return}currentItems=data||[];await hydratePhotos();renderItems();updateSpaceCard()} 
async function hydratePhotos(){for(const item of currentItems){item.photoUrls=[];for(const p of (item.house_item_photos||[])){const r=await sb.storage.from('house-photos').createSignedUrl(p.storage_path,3600);if(!r.error&&r.data?.signedUrl)item.photoUrls.push({id:p.id,path:p.storage_path,url:r.data.signedUrl})}}}
function renderItems(){const c=document.getElementById('items'),q=document.getElementById('search').value.trim().toLowerCase();c.innerHTML='';const active=currentItems.filter(x=>!x.completed).filter(x=>(x.title+' '+(x.note||'')).toLowerCase().includes(q));const done=currentItems.filter(x=>x.completed).filter(x=>(x.title+' '+(x.note||'')).toLowerCase().includes(q));if(!active.length&&!done.length)c.innerHTML='<div class="empty"><b>Nothing here yet.</b><span>Add the first thing you need to remember.</span></div>';active.forEach(x=>appendItem(c,x));if(done.length){const l=document.createElement('div');l.className='section-label';l.textContent='Completed';c.appendChild(l);done.forEach(x=>appendItem(c,x,true))}document.getElementById('openCount').textContent=currentItems.filter(x=>!x.completed).length;document.getElementById('doneCount').textContent=currentItems.filter(x=>x.completed).length;document.getElementById('photoCount').textContent=currentItems.reduce((n,x)=>n+(x.photoUrls?.length||0),0)}
function appendItem(c,item,done=false){const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="item-row"><button class="check ${done?'done':''}" aria-label="Complete">${done?'✓':''}</button><div class="item-main"><div class="item-title">${esc(item.title)}</div>${item.note?`<div class="note">${esc(item.note)}</div>`:''}</div><div class="item-actions"><button class="icon-btn edit" title="Edit">✎</button><button class="icon-btn del" title="Delete">⌫</button></div></div>${item.photoUrls?.length?`<div class="thumbs">${item.photoUrls.map(p=>`<img class="thumb" src="${esc(p.url)}" alt="">`).join('')}</div>`:''}`;el.querySelector('.check').onclick=()=>toggleItem(item);el.querySelector('.edit').onclick=()=>openEdit(item);el.querySelector('.del').onclick=()=>removeItem(item);c.appendChild(el)}
function addQuick(){const input=document.getElementById('quickInput'),title=input.value.trim();if(!title)return;openEdit(null,title);input.value=''}
async function toggleItem(item){const r=await sb.from('house_items').update({completed:!item.completed,completed_at:item.completed?null:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',item.id);if(r.error){alert(r.error.message);return}await loadItems()}
function openEdit(item=null,prefilledTitle=''){editingId=item?.id||null;deletedPhotoPaths=[];stagedPhotos=(item?.photoUrls||[]).map(x=>({...x,existing:true}));document.getElementById('editTitle').textContent=item?'Edit item':'New item';document.getElementById('itemTitle').value=item?.title||prefilledTitle||'';document.getElementById('itemNote').value=item?.note||'';document.getElementById('deleteEdit').style.display=item?'block':'none';document.getElementById('photoInput').value='';renderPhotoPreview();document.getElementById('editOverlay').classList.add('show');setTimeout(()=>document.getElementById('itemTitle').focus(),60)}
function closeEdit(){document.getElementById('editOverlay').classList.remove('show');editingId=null;stagedPhotos=[]}
function renderPhotoPreview(){document.getElementById('photoPreview').innerHTML=stagedPhotos.map((p,i)=>`<div class="preview-wrap"><img src="${esc(p.url||p.localUrl)}"><button class="remove-photo" onclick="removeStaged(${i})">×</button></div>`).join('')}
function removeStaged(i){const p=stagedPhotos[i];if(p.existing&&p.path)deletedPhotoPaths.push(p.path);stagedPhotos.splice(i,1);renderPhotoPreview()}
document.getElementById('photoInput').addEventListener('change',async e=>{for(const f of [...e.target.files]){const compressed=await compressImage(f);stagedPhotos.push({file:compressed,localUrl:URL.createObjectURL(compressed)});renderPhotoPreview()}e.target.value=''})
async function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image();const reader=new FileReader();reader.onload=()=>{img.onload=()=>{const max=1600;let w=img.width,h=img.height;if(Math.max(w,h)>max){const scale=max/Math.max(w,h);w=Math.round(w*scale);h=Math.round(h*scale)}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);canvas.toBlob(b=>b?resolve(new File([b],'photo.jpg',{type:'image/jpeg'})):reject(new Error('Compression failed')),'image/jpeg',.78)};img.onerror=reject;img.src=reader.result};reader.readAsDataURL(file)})}
async function saveItem(){if(!await requireAuth())return;const title=document.getElementById('itemTitle').value.trim(),note=document.getElementById('itemNote').value.trim();if(!title)return;let item;if(editingId){const r=await sb.from('house_items').update({title,note,updated_at:new Date().toISOString()}).eq('id',editingId).select().single();if(r.error){alert(r.error.message);return}item=r.data}else{const r=await sb.from('house_items').insert({space_no:selectedSpace+1,title,note,completed:false,created_by:currentUser.id}).select().single();if(r.error){alert(r.error.message);return}item=r.data}for(const path of deletedPhotoPaths){await sb.storage.from('house-photos').remove([path]);await sb.from('house_item_photos').delete().eq('storage_path',path)}for(const p of stagedPhotos.filter(x=>x.file)){const path=`${currentUser.id}/${item.id}/${crypto.randomUUID()}.jpg`;const up=await sb.storage.from('house-photos').upload(path,p.file,{contentType:'image/jpeg',upsert:false});if(up.error){alert('Photo upload failed: '+up.error.message);continue}const ins=await sb.from('house_item_photos').insert({item_id:item.id,storage_path:path});if(ins.error)alert(ins.error.message)}await loadItems();await loadHomeCounts();closeEdit()}
async function deleteItem(){if(!editingId||!confirm('Delete this item?'))return;const item=currentItems.find(x=>x.id===editingId);for(const p of (item?.photoUrls||[]))await sb.storage.from('house-photos').remove([p.path]);const r=await sb.from('house_items').delete().eq('id',editingId);if(r.error){alert(r.error.message);return}closeEdit();await loadItems()}
async function removeItem(item){if(!confirm('Delete this item?'))return;for(const p of (item.photoUrls||[]))await sb.storage.from('house-photos').remove([p.path]);const r=await sb.from('house_items').delete().eq('id',item.id);if(r.error){alert(r.error.message);return}await loadItems()}
async function refreshSpace(){const b=document.querySelector('.refresh');b.style.transform='rotate(360deg)';await loadItems();setTimeout(()=>b.style.transform='',250)}
function updateSpaceCard(){if(selectedSpace===null)return;const open=currentItems.filter(x=>!x.completed).length,done=currentItems.filter(x=>x.completed).length,total=open+done,photos=currentItems.reduce((n,x)=>n+(x.photoUrls?.length||0),0);const m=document.getElementById('meta-'+selectedSpace),p=document.getElementById('prog-'+selectedSpace);if(m)m.textContent=total?`${open} open · ${photos} photos`:'Ready for ideas';if(p)p.style.width=total?`${Math.round(done/total*100)}%`:'0%'}
function setupRealtime(){if(realtime)return;realtime=sb.channel('house-live').on('postgres_changes',{event:'*',schema:'public',table:'house_items'},()=>{if(selectedSpace!==null)loadItems();loadHomeCounts()}).subscribe()}
sb.auth.onAuthStateChange((_e,s)=>{currentUser=s?.user||null});
async function boot(){document.body.classList.add('auth-pending');const ok=await session();if(!ok){document.getElementById('loginOverlay').classList.add('show');return}await loadSpaces();document.body.classList.remove('auth-pending')}boot();
</script>
</body></html>
